<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0B0B0B">
  <title>Compra sem cadastro | Luxuriosa</title>
  <meta name="description" content="Na Luxuriosa, você pode fazer seu pedido sem criar uma conta.">
  <link rel="icon" href="img/site/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--wine:#8B1E3F;--black:#0B0B0B;--gold:#D4AF7C;--blush:#F7D7D9;--muted:#b9a9ae}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,rgba(139,30,63,.22),transparent 45%),var(--black);color:#f3e9eb;font:14px/1.8 Montserrat,Arial,sans-serif}
    main{width:min(100%,560px);padding:clamp(26px,6vw,48px);border:1px solid rgba(212,175,124,.25);border-radius:18px;background:#151114;text-align:center}
    .brand{margin:0 0 4px;color:var(--blush);font:500 30px "Playfair Display",Georgia,serif;letter-spacing:.06em}
    .kicker{color:var(--gold);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:20px 0 12px;color:var(--blush);font:400 clamp(30px,7vw,42px)/1.15 "Playfair Display",Georgia,serif}
    p{color:var(--muted)}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:18px;padding:0 24px;border:1px solid var(--wine);border-radius:7px;background:var(--wine);color:#fff;text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.1em}
    a:hover{background:#a32950}
  </style>
</head>
<body>
  <main>
    <p class="brand">LUXURIOSA</p>
    <span class="kicker">Compra simples e discreta</span>
    <h1>Você não precisa criar uma conta.</h1>
    <p>Escolha seus produtos, adicione ao carrinho e continue para finalizar. Vamos solicitar apenas os dados necessários para organizar sua compra e enviar o pedido pelo WhatsApp.</p>
    <a href="/loja.html">IR PARA A LOJA</a>
  </main>
</body>
</html>
