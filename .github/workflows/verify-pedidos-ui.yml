name: Verify Pedidos operational UI

on:
  pull_request:
    paths:
      - "previa/lux-gestao-pedidos/index.html"
      - ".github/workflows/verify-pedidos-ui.yml"
  push:
    branches: [main]
    paths:
      - "previa/lux-gestao-pedidos/index.html"
      - ".github/workflows/verify-pedidos-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Pedidos preview JavaScript and ownership
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "previa/lux-gestao-pedidos/index.html";
            const html = readFileSync(path, "utf8");
            const scripts = [...html.matchAll(/<script type="module">([\\s\\S]*?)<\\/script>/g)];
            if (!scripts.length) throw new Error("Módulo JavaScript não encontrado.");
            const source = scripts[scripts.length - 1][1];
            if (!source.includes("action:\"admin_orders_list\"")) throw new Error("A fila não usa o endpoint operacional.");
            for (const forbidden of ["renderSalesLedger", "allSales", "admin_dashboard", "revenue_period", "top_products"]) {
              if (html.includes(forbidden)) throw new Error("Referência duplicada/analítica: " + forbidden);
            }
            writeFileSync("/tmp/pedidos-preview.mjs", source);
          '
          node --check /tmp/pedidos-preview.mjs
