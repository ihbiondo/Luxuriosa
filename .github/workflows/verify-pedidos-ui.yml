name: Verify legacy Pedidos redirect
on:
  pull_request:
    paths: ["lux-gestao-pedidos/index.html","previa/lux-gestao-pedidos/index.html",".github/workflows/verify-pedidos-ui.yml"]
  push:
    branches: [main]
    paths: ["lux-gestao-pedidos/index.html","previa/lux-gestao-pedidos/index.html",".github/workflows/verify-pedidos-ui.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Confirmar que URLs antigas não expõem o painel
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const path of ["lux-gestao-pedidos/index.html","previa/lux-gestao-pedidos/index.html"]) {
            const html = fs.readFileSync(path,"utf8");
            if (!html.includes("https://442.luxuriosa.com.br/apps/pedidos-site/")) throw new Error(path + ": redirecionamento ausente.");
            if (html.includes("admin_orders_list") || html.includes("SUPABASE") || html.includes("signInWithPassword")) throw new Error(path + ": código administrativo ainda público.");
          }
          console.log("URLs antigas de Pedidos seguras e redirecionadas.");
          NODE
