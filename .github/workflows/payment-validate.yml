    branches: [main]
    paths:
      - "index.html"
      - "loja.html"
      - "atendimento.html"
      - "faq.html"
      - "entregas/**"
      - "cidades/**"
      - "previa/**"
      - "login.html"
      - "minha-conta/**"
      - ".github/scripts/**"
      - "pagamento-retorno.html"
      - "acompanhar-pedido/**"
      - "portal/**"
      - "experiencias/**"
      - "educacao/interatividade/**"
      - "js/clientes.js"
      - "js/carrinho.js"
      - "supabase/functions/create-payment-order/index.ts"
      - "supabase/migrations/20261116181752_standardize_delivery_fees.sql"
      - "supabase/tests/database/freight_rules.test.sql"
      - "tests/fixtures/freight_rules_fixture.sql"
      - "js/portal.js"
      - "js/conquistas*.js"
      - "js/experiencias*.js"
      - "js/signos.js"
      - "js/educacao-interatividade.js"
      - "css/conquistas.css"
      - "css/experiencias.css"
      - "css/portal.css"
      - "css/educacao.css"
      - "supabase/migrations/20261115181510_create_experience_results.sql"
      - "supabase/tests/database/experience_results.test.sql"
      - "tests/conquistas.test.js"
      - "tests/e2e/**"
      - "termos-experiencias.html"
