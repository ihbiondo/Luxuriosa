      - "supabase/tests/database/experience_results.test.sql"
      - "tests/conquistas.test.js"
      - "tests/e2e/**"
      - "termos-experiencias.html"
      - "privacidade.html"
      - "data/produtos.json"
      - "css/**"
      - "js/catalogo.js"
      - "produtos/**"
