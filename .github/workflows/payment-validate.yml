permissions:
  contents: read

jobs:
  validate:
    name: Validar experiência pública
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Inclui validação estática das regras de frete do checkout e do backend.
      - name: Validar JavaScript do checkout, login e acompanhamento
        run: |
          node --check js/clientes.js
          node --check js/carrinho.js
          node --test .github/scripts/account-registration.test.cjs
          node --test .github/scripts/google-oauth.test.cjs
          npx --yes esbuild@0.25.0 supabase/functions/create-payment-order/index.ts --format=esm --platform=neutral --outfile=/tmp/create-payment-order.js
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const pages = ["index.html","loja.html","login.html","minha-conta/index.html","meus-pedidos/index.html","pagamento-retorno.html","acompanhar-pedido/index.html"];
          for (const page of pages) {
            const html = fs.readFileSync(page, "utf8");
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
            let checked = 0;
            for (let i = 0; i < scripts.length; i++) {
              const attrs = scripts[i][1] || "";
              if (/\bsrc\s*=/.test(attrs)) continue;
              const type = attrs.match(/\btype\s*=\s*["']([^"']+)["']/i)?.[1]?.toLowerCase();
              if (type && !["module","text/javascript","application/javascript"].includes(type)) continue;
              const ext = type === "module" ? ".mjs" : ".js";
              const file = "/tmp/site-" + page.replace(/[^a-z0-9]/gi,"-") + "-" + i + ext;
              fs.writeFileSync(file, scripts[i][2]);
              execFileSync(process.execPath, ["--check", file], {stdio:"inherit"});
              checked++;
            }
            console.log(page + ": " + checked + " script(s) válidos");
          }
          JSON.parse(fs.readFileSync("data/produtos.json","utf8"));
          console.log("Catálogo público válido.");
          NODE
      - name: Validar módulos de Minhas conquistas
        run: |
          python -m pip install "pglast>=7,<8"
          node --check js/educacao.js
          node --check js/educacao-interatividade.js
          node --check js/experiencias.js
          node --check --input-type=module < js/portal.js
          node --check --input-type=module < js/experiencias-salvar.js
          node --check --input-type=module < js/conquistas.js
          node --check --input-type=module < js/conquistas-core.js
          node --test tests/conquistas.test.js
          python - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20261115181510_create_experience_results.sql").read_text()
          freight_migration = Path("supabase/migrations/20261116181752_standardize_delivery_fees.sql").read_text()
          freight_backend = Path("supabase/functions/create-payment-order/index.ts").read_text()
          delivery_page = Path("entregas/index.html").read_text()
          delivery_faq = Path("faq.html").read_text()
          terms = Path("termos-experiencias.html").read_text()
          dashboard = Path("portal/conquistas/index.html").read_text()
          portal = Path("portal/index.html").read_text()
          save_module = Path("js/experiencias-salvar.js").read_text()
          core_module = Path("js/conquistas-core.js").read_text()
          test_module = Path("tests/conquistas.test.js").read_text()
          signs_module = Path("js/signos.js").read_text()
          achievements_module = Path("js/conquistas.js").read_text()
          signs_page = Path("experiencias/signos.html").read_text()

          migration_lower = migration.lower()
          assert "experience_terms_acceptances" in migration_lower
          assert "enable row level security" in migration_lower
          assert "revoke_my_experience_terms" in migration_lower
          assert "accept_my_experience_terms" in migration_lower
          assert "revoke all on public.experience_terms_acceptances from public, anon, authenticated;" in migration_lower
          assert "revoke all on public.experience_results from public, anon, authenticated;" in migration_lower
          assert "grant select on public.experience_terms_acceptances to authenticated;" in migration_lower
          assert "grant select, insert, update on public.experience_terms_acceptances" not in migration_lower
          assert "experience_terms_acceptances_insert_own" not in migration_lower
          assert "experience_terms_acceptances_update_own" not in migration_lower
          assert migration_lower.count("security definer") == 2
          assert migration_lower.count("set search_path = ''") == 2
          assert "revoke all on function public.accept_my_experience_terms(text) from public;" in migration_lower
          assert "revoke all on function public.revoke_my_experience_terms() from public;" in migration_lower
          assert "luxuriosa-experiencias-v1-2026-11" in terms
          assert "conquistasTermsCheckbox" in dashboard
          assert "portalAchievementsActivationCard" in portal
          assert "lux_pending_experience_result" not in save_module
          assert "buildExperienceResult" in save_module
          assert "calculateAchievementStats" in Path("js/conquistas.js").read_text()
          assert "birthDate" not in core_module and "answers" not in core_module
          assert 'sign_profile: { title: "Descubra seu signo solar", category: "astrologia" }' in core_module
          assert 'sign_compatibility: { title: "Combinação entre signos", category: "astrologia" }' in core_module
          assert 'activity_id: "sign_profile"' in signs_module
          assert 'activity_id: "sign_compatibility"' in signs_module
          assert "sign_profile:" in core_module and "sign_compatibility:" in core_module
          assert 'src="/js/experiencias-salvar.js"' in signs_page
          assert 'id="experienceSavePanel"' in signs_page
          assert "dateInput.value" not in signs_module[signs_module.index('activity_id: "sign_profile"'):signs_module.index("const studio = document.getElementById(\"solarShareStudio\")", signs_module.index('activity_id: "sign_profile"'))]
          print("Regras básicas de aceite, privacidade e atividades atuais verificadas.")

          from pglast import parse_sql
          parse_sql(migration)
          print("Sintaxe SQL da migração validada.")
          parse_sql(freight_migration)
          print("Sintaxe SQL da migração de frete validada.")
          assert "club_delivery_fee_cents" in freight_migration
          assert "tibirica" in freight_backend and "freight_quote_required" in freight_backend
          assert "R$ 15,00" in delivery_page and "R$ 10,00" in delivery_page
          assert "R$ 50,00" in delivery_page and "R$ 40,00" in delivery_page
          assert "o pedágio já está incluído" in delivery_page
          assert "cotado pelo atendimento" in delivery_faq
          assert "55 km pela rota" not in delivery_page
          print("Política oficial de frete e exceção de Tibiriçá verificadas.")
          PY

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Testar banco e jornada E2E em ambiente local descartável
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          site_server_pid=""
          cleanup() {
            if [[ -n "$site_server_pid" ]]; then
              kill "$site_server_pid" >/dev/null 2>&1 || true
            fi
            (cd "$test_root" && supabase stop) >/dev/null 2>&1 || true
            rm -rf "$test_root"
          }
          trap cleanup EXIT

          # Projeto scratch: fixtures isoladas de login, frete e migration de conquistas.
          # Não há token, project-ref, link ou credencial do Supabase hospedado.
          mkdir -p "$test_root/supabase/migrations" "$test_root/supabase/tests/database"
          cp "$GITHUB_WORKSPACE/supabase/config.toml" "$test_root/supabase/config.toml"
          # O runner pode já ter processos usando as portas padrão do Supabase.
          # Reserve portas livres para esta pilha descartável sem alterar a configuração versionada.
          python3 - "$test_root/supabase/config.toml" <<'PY'
          import socket
          import sys
          from pathlib import Path

          config_path = Path(sys.argv[1])
          reservations = []
          for _ in range(4):
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.bind(("0.0.0.0", 0))
              reservations.append(sock)
          ports = [sock.getsockname()[1] for sock in reservations]
          for sock in reservations:
              sock.close()

          settings = {
              "api": {"port": ports[0]},
              "db": {"port": ports[1], "shadow_port": ports[2]},
              "local_smtp": {"port": ports[3]},
          }
          lines = config_path.read_text(encoding="utf-8").splitlines()
          section = None
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  section = stripped[1:-1]
                  continue
              if section not in settings or "=" not in line:
                  continue
              key = line.split("=", 1)[0].strip()
              if key in settings[section]:
                  value = settings[section].pop(key)
                  lines[index] = f"{key} = {value}"

          missing = {name: values for name, values in settings.items() if values}
          if missing:
              raise SystemExit(f"Não foi possível configurar as portas locais: {missing}")
          config_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Portas locais isoladas: API={ports[0]}, DB={ports[1]}, shadow={ports[2]}, SMTP={ports[3]}")
          PY
          cp "$GITHUB_WORKSPACE/tests/e2e/login-fixtures.sql" "$test_root/supabase/migrations/20261115130000_e2e_login_fixtures.sql"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261115181510_create_experience_results.sql" "$test_root/supabase/migrations/"
          cp "$GITHUB_WORKSPACE/supabase/tests/database/experience_results.test.sql" "$test_root/supabase/tests/database/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/freight_rules_fixture.sql" "$test_root/supabase/migrations/20261115120000_freight_rules_fixture.sql"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261116181752_standardize_delivery_fees.sql" "$test_root/supabase/migrations/"
          cp "$GITHUB_WORKSPACE/supabase/tests/database/freight_rules.test.sql" "$test_root/supabase/tests/database/"

          cd "$test_root"
          supabase start
          supabase db reset
          supabase test db

          # Copia temporária do site. Somente a cópia recebe a URL/chave local.
          site="$test_root/site"
          mkdir -p "$site"
          tar --exclude=.git --exclude=node_modules -cf - -C "$GITHUB_WORKSPACE" . | tar -xf - -C "$site"

          supabase status --output env --output-format text > "$test_root/supabase.env"
          set -a
          source "$test_root/supabase.env"
          set +a
          : "${API_URL:?API_URL ausente no Supabase local}"
          : "${ANON_KEY:?ANON_KEY ausente no Supabase local}"
          : "${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY ausente no Supabase local}"

          python - "$site" "$API_URL" "$ANON_KEY" <<'PY'
          import sys
          from pathlib import Path

          site = Path(sys.argv[1])
          local_url, local_key = sys.argv[2], sys.argv[3]
          hosted_url = "https://byiykxfugvxuowueuxca.supabase.co"
          hosted_key = "sb_publishable_LaMbeWQ1PNANEQ85SD_35Q_wDzswy8y"
          files = [
              "login.html",
              "js/portal.js",
              "js/conquistas.js",
              "js/experiencias-salvar.js",
          ]
          for relative in files:
              path = site / relative
              original = path.read_text(encoding="utf-8")
              if hosted_url not in original or hosted_key not in original:
                  raise SystemExit(f"Configuração Supabase esperada não encontrada em {relative}")
              path.write_text(
                  original.replace(hosted_url, local_url).replace(hosted_key, local_key),
                  encoding="utf-8"
              )
          print("Cópia E2E do site configurada exclusivamente para o Supabase local.")
          PY

          cd "$site"
          npm init -y >/dev/null
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$site" > "$test_root/site-server.log" 2>&1 &
          site_server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/login.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/login.html >/dev/null

          mkdir -p "$GITHUB_WORKSPACE/e2e-screenshots"
          RESPONSIVE_SCREENSHOT_DIR="$GITHUB_WORKSPACE/e2e-screenshots/responsividade" \
          RESPONSIVE_REPORT_PATH="$GITHUB_WORKSPACE/e2e-screenshots/responsividade/report.json" \
          E2E_BASE_URL="http://127.0.0.1:4173" \
          node "$site/tests/e2e/responsividade.mjs"

          E2E_BASE_URL="http://127.0.0.1:4173" \
          E2E_SUPABASE_URL="$API_URL" \
          E2E_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          E2E_SCREENSHOT_DIR="$GITHUB_WORKSPACE/e2e-screenshots" \
          node "$site/tests/e2e/minhas-conquistas.mjs"

      - name: Publicar evidências visuais do E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minhas-conquistas-visual-${{ github.run_id }}
          path: e2e-screenshots/
          if-no-files-found: warn
          retention-days: 7

