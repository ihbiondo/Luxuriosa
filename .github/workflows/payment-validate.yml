# Validação também cobre a transferência dos endpoints administrativos de pedidos.
name: Validacao do checkout InfinitePay

on:
  push:
    branches:
      - "main"
      - "fix/infinitepay-payment-only"
    paths:
      - "pagamento-retorno.html"
      - "gestao-privada-8f2c6d.html"
      - "supabase/functions/create-payment-order/**"
      - "acompanhar-pedido/**"
      - "lux-gestao-pedidos/**"
      - "supabase/functions/cart-orders/**"
      - "js/clientes.js"
      - "login.html"
      - "loja.html"
      - "supabase/functions/_shared/**"
      - "supabase/functions/infinitepay-webhook/**"
      - "supabase/functions/payment-status/**"
      - "supabase/functions/payment-admin/**"
      - "supabase/functions/luxuriosa-intelligence/**"
      - "supabase/functions/management-sales/**"
      - "supabase/functions/_shared/inventory.*"
      - "supabase/functions/orders-admin/**"
      - "supabase/config.toml"
      - "supabase/functions/infinitepay-test-checkout/**"
      - "supabase/functions/infinitepay-test-webhook/**"
      - "supabase/migrations/20261110153000_isolated_infinitepay_test_payments.sql"
      - ".github/scripts/infinitepay-test.integration.sql"
      - "supabase/migrations/20261110120000_atomic_infinitepay_payment_confirmation.sql"
      - ".github/scripts/payment-confirmation.*"
      - ".github/workflows/payment-validate.yml"
  pull_request:
    paths:
      - "gestao-privada-8f2c6d.html"
      - "previa/lux-central/index.html"
      - "previa/lux-gestao/index.html"
      - "previa/lux-gestao-pedidos/**"
      - "pagamento-retorno.html"
      - "supabase/functions/create-payment-order/**"
      - "acompanhar-pedido/**"
      - "lux-gestao-pedidos/**"
      - "supabase/functions/cart-orders/**"
      - "supabase/functions/orders-admin/**"
      - "supabase/config.toml"
      - "js/clientes.js"
      - "login.html"
      - "loja.html"
      - "supabase/functions/_shared/**"
      - "supabase/functions/infinitepay-webhook/**"
      - "supabase/functions/payment-status/**"
      - "supabase/functions/payment-admin/**"
      - "supabase/functions/luxuriosa-intelligence/**"
      - "supabase/functions/management-sales/**"
      - "supabase/functions/_shared/inventory.*"
      - "supabase/functions/infinitepay-test-checkout/**"
      - "supabase/functions/infinitepay-test-webhook/**"
      - "supabase/migrations/20261110153000_isolated_infinitepay_test_payments.sql"
      - ".github/scripts/infinitepay-test.integration.sql"
      - "supabase/migrations/20261110120000_atomic_infinitepay_payment_confirmation.sql"
      - ".github/scripts/payment-confirmation.*"
      - ".github/workflows/payment-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validacao do checkout
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxuriosa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luxuriosa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos das Edge Functions
        run: |
          deno check supabase/functions/create-payment-order/index.ts
          deno check supabase/functions/cart-orders/index.ts
          deno check supabase/functions/_shared/infinitepay-payment.ts
          deno check supabase/functions/infinitepay-webhook/index.ts
          deno check supabase/functions/payment-status/index.ts
          deno check supabase/functions/payment-admin/index.ts
          deno check supabase/functions/luxuriosa-intelligence/index.ts
          deno check supabase/functions/management-sales/index.ts
          deno check supabase/functions/_shared/inventory.ts
          deno test supabase/functions/_shared/inventory.test.ts
          deno check supabase/functions/orders-admin/index.ts
          deno check supabase/functions/infinitepay-test-checkout/index.ts
          deno check supabase/functions/infinitepay-test-webhook/index.ts

      - name: Preparar acesso ao PostgreSQL 17
        run: |
          POSTGRES_CONTAINER=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17/ {print $1; exit}')
          test -n "$POSTGRES_CONTAINER"
          echo "POSTGRES_CONTAINER=$POSTGRES_CONTAINER" >> "$GITHUB_ENV"

      - name: Testar confirmação atômica no PostgreSQL 17
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /workspace/.github/scripts /workspace/supabase/migrations
          docker cp .github/scripts/payment-confirmation.integration.sql "$POSTGRES_CONTAINER":/workspace/.github/scripts/payment-confirmation.integration.sql
          docker cp supabase/migrations/20261110120000_atomic_infinitepay_payment_confirmation.sql "$POSTGRES_CONTAINER":/workspace/supabase/migrations/
          docker exec -e PGPASSWORD=postgres -w /workspace "$POSTGRES_CONTAINER" psql -h 127.0.0.1 -U postgres -d luxuriosa_test -v ON_ERROR_STOP=1 -f .github/scripts/payment-confirmation.integration.sql

      - name: Testar isolamento do pagamento de R$ 1
        run: |
          docker cp .github/scripts/infinitepay-test.integration.sql "$POSTGRES_CONTAINER":/workspace/.github/scripts/infinitepay-test.integration.sql
          docker cp supabase/migrations/20261110153000_isolated_infinitepay_test_payments.sql "$POSTGRES_CONTAINER":/workspace/supabase/migrations/
          docker exec -e PGPASSWORD=postgres -w /workspace "$POSTGRES_CONTAINER" psql -h 127.0.0.1 -U postgres -d luxuriosa_test -v ON_ERROR_STOP=1 -f .github/scripts/infinitepay-test.integration.sql

      - name: Testar contrato de confirmação
        run: node --test .github/scripts/payment-confirmation.test.cjs

      - name: Validar campos obrigatórios do checkout
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          for (const file of ["index.html", "loja.html"]) {
            const html = fs.readFileSync(file, "utf8");
            const emailField = /<input\b(?=[^>]*\bid=["']customerEmail["'])(?=[^>]*\btype=["']email["'])(?=[^>]*\brequired\b)[^>]*>/i;
            if (!emailField.test(html)) throw new Error(file + " precisa conter o campo de e-mail obrigatório do checkout.");
          }
          const customerScript = fs.readFileSync("js/clientes.js", "utf8");
          if (!/var required = exigirEndereco[\s\S]*?["']customerEmail["']/.test(customerScript)) {
            throw new Error("A validação do checkout precisa exigir e-mail.");
          }
          console.log("Campos de e-mail do checkout validados nas duas páginas.");
          NODE


      - name: Validar checkout autenticado e acompanhamento privado
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const cp = require("node:child_process");
          const customer = fs.readFileSync("js/clientes.js", "utf8");
          const login = fs.readFileSync("login.html", "utf8");
          const tracking = fs.readFileSync("acompanhar-pedido/index.html", "utf8");
          const admin = fs.readFileSync("lux-gestao-pedidos/index.html", "utf8");
          const previewAdmin = fs.readFileSync("previa/lux-gestao-pedidos/index.html", "utf8");
          const ordersPanel = previewAdmin;
          const payment = fs.readFileSync("supabase/functions/create-payment-order/index.ts", "utf8");
          const ordersFunction = fs.readFileSync("supabase/functions/cart-orders/index.ts", "utf8");
          const ordersAdminFunction = fs.readFileSync("supabase/functions/orders-admin/index.ts", "utf8");
          cp.execFileSync(process.execPath, ["--check", "js/clientes.js"], { stdio: "inherit" });
          for (const [file, html] of [["login.html", login], ["acompanhar-pedido/index.html", tracking], ["lux-gestao-pedidos/index.html", admin], ["previa/lux-gestao-pedidos/index.html", previewAdmin]]) {
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            for (let i = 0; i < scripts.length; i++) {
              const path = "/tmp/" + file.replace(/[^a-z0-9]/gi, "-") + "-" + i + ".mjs";
              fs.writeFileSync(path, scripts[i][1]);
              cp.execFileSync(process.execPath, ["--check", path], { stdio: "inherit" });
            }
          }
          if (!customer.includes('localStorage.setItem("luxuriosa_checkout_after_login", "1")')) throw new Error("O carrinho precisa preservar a intenção de checkout durante o login.");
          if (!customer.includes('await carregarDadosDaConta()')) throw new Error("O checkout precisa carregar automaticamente os dados cadastrados.");
          if (!payment.includes('code: "account_required"')) throw new Error("A Edge Function precisa bloquear checkout sem conta.");
          if (!ordersFunction.includes('current.payment_status !== "paid"')) throw new Error("A operação administrativa precisa bloquear avanço sem pagamento confirmado.");
          if (!ordersFunction.includes('current.payment_status === "paid"') || !ordersFunction.includes("Faça a conferência e o estorno na InfinitePay")) throw new Error("O painel não pode cancelar pedido pago sem conciliação de estorno.");
          if (!ordersPanel.includes('action:"admin_dashboard"') || !ordersPanel.includes('action:"admin_update_order_status"')) throw new Error("O painel Lux-Gestão precisa consultar e atualizar pedidos.");
          if (!ordersPanel.includes('invokeOrdersAdmin({action:"admin_dashboard"') || !ordersAdminFunction.includes('action === "admin_dashboard"')) throw new Error("O dashboard precisa usar o endpoint administrativo isolado.");
          if (!ordersPanel.includes("/functions/v1/orders-admin") || !ordersAdminFunction.includes('action === "admin_update_order_status"')) throw new Error("A atualização de etapa precisa usar o endpoint administrativo isolado.");
          const webhook = fs.readFileSync("supabase/functions/infinitepay-webhook/index.ts", "utf8");
          if (!payment.includes('events: ["created", "paid", "settled", "refunded", "canceled", "payment_failed"]')) throw new Error("O checkout precisa assinar o evento created para monitorar a entrega do webhook.");
          if (!webhook.includes('eventName === "created"') || !webhook.includes('eventType === "created"')) throw new Error("O webhook precisa registrar o evento created sem alterar o pedido.");
          if (!webhook.includes('infinitepay-webhook.unclassified-event') || !webhook.includes("payloadKeys")) throw new Error("O webhook precisa registrar diagnóstico seguro quando não reconhecer o evento recebido.");
          const paymentAdmin = fs.readFileSync("supabase/functions/payment-admin/index.ts", "utf8");
          if (!ordersPanel.includes('/functions/v1/payment-admin') || !ordersPanel.includes('action:"reconcile_payment"')) throw new Error("O painel precisa acionar a conciliação administrativa da InfinitePay.");
          if (!ordersFunction.includes("payment_checkout_url, payment_expires_at, payment_amount_cents")) throw new Error("O painel precisa receber link, expiração e valor da cobrança.");
          if (!paymentAdmin.includes('action === "reconcile_payment"') || !paymentAdmin.includes('/functions/v1/payment-status')) throw new Error("A conciliação precisa consultar o verificador da InfinitePay.");
          if (!paymentAdmin.includes('references_required') || !paymentAdmin.includes('payment_provider_events')) throw new Error("A conciliação precisa recuperar referências do webhook ou solicitar os dados manualmente.");
          if (!paymentAdmin.includes('success=true e paid=true')) throw new Error("O sistema não pode aprovar pagamento sem confirmação positiva da InfinitePay.");
          if (!tracking.includes('.eq("customer_id",user.id)')) throw new Error("A consulta de pedidos precisa filtrar pelo usuário autenticado.");
          if (!tracking.includes("payment_checkout_url") || !tracking.includes("checkout.infinitepay.io")) throw new Error("O cliente precisa conseguir retomar uma cobrança pendente na InfinitePay.");
          for (const label of ["Aguardando pagamento", "Pagamento aprovado", "Em expedição", "Em rota de entrega", "Pedido entregue"]) {
            if (!tracking.includes(label)) throw new Error("Status ausente no acompanhamento: " + label);
          }
          console.log("Checkout autenticado e acompanhamento privado validados.");
          NODE

      - name: Validar migração da inteligência financeira
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const intelligence = fs.readFileSync("supabase/functions/luxuriosa-intelligence/index.ts", "utf8");
          const management = fs.readFileSync("supabase/functions/management-sales/index.ts", "utf8");
          const panel = fs.readFileSync("previa/lux-central/index.html", "utf8");
          if (!intelligence.includes('body.action === "analytics"')) throw new Error("A Inteligência precisa expor a ação analytics.");
          for (const helper of ["summarizeSales", "readExpensesForAnalytics", "readSalesForAnalytics", "readBusinessSignals"]) {
            if (!intelligence.includes("function " + helper) && !intelligence.includes("async function " + helper)) throw new Error("Helper ausente na Inteligência: " + helper);
          }
          if (!panel.includes('functions.invoke("luxuriosa-intelligence",{body:{action:"analytics"')) throw new Error("O Lux-Central ainda não consulta analytics na Inteligência.");
          if (!management.includes('action === "analytics"')) throw new Error("A ação legada deve permanecer disponível durante a transição.");
          if (!intelligence.includes('from("payment_provider_events")') || !intelligence.includes("payment_events: paymentEvents")) throw new Error("A Inteligência precisa agregar a cobertura dos webhooks de pagamento.");
          if (!intelligence.includes("HISTORICAL_TEST_ORDER_IDS") || !intelligence.includes("total: websiteOrders.length")) throw new Error("A Inteligência precisa excluir tentativas históricas de teste dos indicadores operacionais.");
          if (!intelligence.includes('select("order_id, provider, event_type, verified, processing_error, received_at")')) throw new Error("A cobertura de webhooks precisa excluir eventos associados aos pedidos de teste.");
          for (const field of ["pending_expired_count", "pending_without_checkout_link_count", "active_pending_count", "checkout_link_count"]) {
            if (!intelligence.includes(field)) throw new Error("A Inteligência precisa expor o diagnóstico de cobranças: " + field);
          }
          if (!panel.includes("Eventos de pagamento recebidos") || !panel.includes("Eventos com erro de processamento") || !panel.includes("Cobranças expiradas")) throw new Error("O Lux-Central precisa exibir a saúde dos webhooks e dos links.");
          if (!panel.includes("Revisar cobranças expiradas")) throw new Error("O Lux-Central precisa orientar a revisão de cobranças expiradas.");
          console.log("Migração financeira, cobertura de webhooks e compatibilidade legada validadas.");
          NODE

      - name: Validar JavaScript da página de retorno
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("pagamento-retorno.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error("Nenhum script encontrado na página de retorno.");
          scripts.forEach((match, index) => {
            const path = "/tmp/pagamento-retorno-" + index + ".js";
            fs.writeFileSync(path, match[1]);
            require("node:child_process").execFileSync(process.execPath, ["--check", path], { stdio: "inherit" });
          });
          console.log("Scripts da página de retorno validados.");
          NODE
 
      - name: Validar JavaScript do Lux-Central
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("previa/lux-central/index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error("Nenhum script encontrado no Lux-Central.");
          scripts.forEach((match, index) => {
            const path = "/tmp/lux-central-" + index + ".js";
            fs.writeFileSync(path, match[1]);
            require("node:child_process").execFileSync(process.execPath, ["--check", path], { stdio: "inherit" });
          });
          if (!html.includes("Aguardando contagem física")) throw new Error("Painel não informa a pendência de contagem física.");
          if (!html.includes("Contagem física registrada") || !html.includes("Cobertura de custos do catálogo")) throw new Error("Painel não apresenta cobertura mensurável de estoque e custos.");
          if (!html.includes("Composições dos kits ainda não foram cadastradas")) throw new Error("Painel não alerta para receitas de kits ausentes.");
          console.log("Scripts e alertas operacionais do Lux-Central validados.");
          NODE

      - name: Validar JavaScript e separação de responsabilidades do Lux-Gestão
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("previa/lux-gestao/index.html", "utf8");
          const scriptTags = [...html.matchAll(/<script[^>]*>/gi)];
          const scripts = scriptTags.map(match => {
            const start = match.index + match[0].length;
            const end = html.indexOf("</script>", start);
            return html.slice(start, end);
          });
          if (!scripts.length) throw new Error("Nenhum script encontrado no Lux-Gestão.");
          scripts.forEach((source, index) => {
            const path = "/tmp/lux-gestao-" + index + ".mjs";
            fs.writeFileSync(path, source);
            require("node:child_process").execFileSync(process.execPath, ["--check", path], { stdio: "inherit" });
          });
          for (const phrase of ["Gestão da loja", "Vendas e caixa", "Pedidos Online", "Contagem física", "Custos e kits", "Despesas"]) {
            if (!html.includes(phrase)) throw new Error("Lux-Gestão precisa manter a função clara: " + phrase);
          }
          if (!html.includes('href="/lux-gestao-pedidos/"')) throw new Error("Lux-Gestão deve manter o acesso separado aos Pedidos Online.");
          console.log("Scripts, propósito do Lux-Gestão e separação dos Pedidos Online validados.");
          NODE

      - name: Validar JavaScript da área administrativa
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("lux-gestao-pedidos/index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error("Nenhum script encontrado no painel Lux-Gestão.");
          scripts.forEach((match, index) => {
            const path = "/tmp/lux-gestao-pedidos-" + index + ".mjs";
            fs.writeFileSync(path, match[1]);
            require("node:child_process").execFileSync(process.execPath, ["--check", path], { stdio: "inherit" });
          });
          console.log("Scripts do painel Lux-Gestão validados.");
          NODE
