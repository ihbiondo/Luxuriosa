      - "portal/**"
      - "experiencias/**"
      - "educacao/interatividade/**"
      - "js/clientes.js"
      - "js/carrinho.js"
      - "supabase/functions/create-payment-order/index.ts"
      - "supabase/config.toml"
      - "supabase/migrations/20261116181752_standardize_delivery_fees.sql"
