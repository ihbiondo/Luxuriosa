name: Verify legacy Intelligence redirect
on:
  pull_request:
    paths: ["lux-central/index.html","previa/lux-central/index.html",".github/workflows/verify-intelligence-preview.yml"]
  push:
    branches: [main]
    paths: ["lux-central/index.html","previa/lux-central/index.html",".github/workflows/verify-intelligence-preview.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar que URLs antigas apontam para o painel protegido
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const path of ["lux-central/index.html","previa/lux-central/index.html"]) {
            const html = fs.readFileSync(path,"utf8");
            if (!html.includes("https://442.luxuriosa.com.br/apps/inteligencia/")) throw new Error(path + ": redirecionamento ausente.");
            if (html.includes("customer-rfv") || html.includes("management-sales") || html.includes("SUPABASE")) throw new Error(path + ": código administrativo ainda público.");
          }
          console.log("URLs antigas da Inteligência redirecionadas.");
          NODE
