name: Validate Education and Experiences

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "termos-experiencias.html"
      - "js/portal.js"
      - "js/conquistas.js"
      - "js/experiencias-salvar.js"
      - "css/educacao.css"
      - "css/experiencias.css"
      - "css/conquistas.css"
      - "css/portal.css"
      - "privacidade.html"
      - "login.html"
      - "supabase/migrations/**"
      - "educacao/**"
      - "docs/educacao/**"
      - "docs/MATRIZ-EDITORIAL-EDUCACAO-120-PAGINAS.md"
      - "experiencias/**"
      - "js/educacao.js"
      - "js/educacao-interatividade.js"
      - "js/experiencias.js"
      - "js/signos.js"
      - "js/signo-detalhe.js"
      - "scripts/validar_educacao.py"
      - "scripts/validar_experiencias.py"
      - "sitemap.xml"
      - ".github/workflows/validate-education.yml"
  pull_request:
    branches: [main]
    paths:
      - "portal/**"
      - "termos-experiencias.html"
      - "js/portal.js"
      - "js/conquistas.js"
      - "js/experiencias-salvar.js"
      - "css/educacao.css"
      - "css/experiencias.css"
      - "css/conquistas.css"
      - "css/portal.css"
      - "privacidade.html"
      - "login.html"
      - "supabase/migrations/**"
      - "educacao/**"
      - "docs/educacao/**"
      - "docs/MATRIZ-EDITORIAL-EDUCACAO-120-PAGINAS.md"
      - "docs/AUDITORIA-CRUZADA-EDUCACAO-2026-11-15.md"
      - "experiencias/**"
      - "js/educacao.js"
      - "js/educacao-interatividade.js"
      - "js/experiencias.js"
      - "js/signos.js"
      - "js/signo-detalhe.js"
      - "scripts/validar_educacao.py"
      - "scripts/validar_experiencias.py"
      - "sitemap.xml"
      - ".github/workflows/validate-education.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate education pages and local links
        run: python scripts/validar_educacao.py
      - name: Validate Experiences cards, quiz and sign profiles
        run: python scripts/validar_experiencias.py
      - name: Check JavaScript syntax
        run: |
          for file in \
            js/educacao.js \
            js/educacao-interatividade.js \
            js/experiencias.js \
            js/signos.js \
            js/signo-detalhe.js; do
            node --check "$file"
          done
          node --check --input-type=module < js/portal.js
          node --check --input-type=module < js/experiencias-salvar.js
          node --check --input-type=module < js/conquistas.js
      - name: Validate structured data and sitemap XML
        run: |
          python -m json.tool data/astrologia.json > /dev/null
          python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
